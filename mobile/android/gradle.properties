# Sized for a 10 GB laptop: the template default (-Xmx8G, 4G metaspace) made
# release builds exhaust memory and crash the editor.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
